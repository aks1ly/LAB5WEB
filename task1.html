
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад іспитів · Лабораторна №5</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="task1.css">
    <script src="task1.js" defer></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>Розклад іспитів</h1>
                <p>Лабораторна робота №5 · Варіант 3</p>
                <p class="student">Галкіна Олександра Володимирівна · КН-32</p>
            </div>

            <nav class="navigation">
                <a href="index.html" class="nav-link">Головна</a>
                <a href="task1.html" class="nav-link active">01 / Іспити</a>
                <a href="task2.html" class="nav-link">02 / DOM-операції</a>
            </nav>
        </header>

        <main class="main">
            <section class="exam-section">
                <h2>Перевірка розкладу</h2>
                <p class="section-description">
                    За день до іспиту проводиться консультація.
                    Оберіть дату, щоб перевірити заплановані події.
                </p>

                <div class="exam-controls">
                    <label for="checkDate">Дата перевірки</label>
                    <input type="date" id="checkDate">
                    <button type="button" id="checkButton">
                        Перевірити
                    </button>
                </div>

                <div class="exam-table-wrapper">
                    <table class="exam-table">
                        <thead>
                            <tr>
                                <th>Предмет</th>
                                <th>Дата іспиту</th>
                                <th>Аудиторія</th>
                            </tr>
                        </thead>
                        <tbody id="examTableBody"></tbody>
                    </table>
                </div>

                <h2 class="result-title">Результати перевірки</h2>
                <div id="examResult" class="exam-result"></div>
            </section>
        </main>
    </div>
</body>
</html>
